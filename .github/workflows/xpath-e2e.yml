name: Specdrive XPath end-to-end experiment
on:
  pull_request:
    paths:
      - 'examples/xpath_lab/**'
      - '.github/workflows/xpath-e2e.yml'
      - 'examples/rails_reference/**'
      - 'runtime/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: npm install --no-audit --no-fund
      - run: npm install --prefix examples/xpath_lab --ignore-scripts --no-audit --no-fund
      - run: npm run build:reference
      - name: Stage shared experimental runtime
        run: |
          home="$(mktemp -d "$RUNNER_TEMP/specdrive-xpath-e2e.XXXXXX")"
          SPECDRIVE_RUNTIME_HOME="$home" bundle exec ruby -Ilib examples/xpath_lab/stage_worker.rb
          echo "SPECDRIVE_RUNTIME_HOME=$home" >> "$GITHUB_ENV"
      - name: Compare real Rails scenarios
        run: |
          mkdir -p xpath-e2e-results
          ruby --version > xpath-e2e-results/versions.txt
          node --version >> xpath-e2e-results/versions.txt
          cp Gemfile.lock package-lock.json xpath-e2e-results/
          cp examples/xpath_lab/package-lock.json xpath-e2e-results/lab-package-lock.json
          python3 examples/xpath_lab/compare_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xpath-e2e-comparison
          path: xpath-e2e-results/
          if-no-files-found: warn
          retention-days: 7
