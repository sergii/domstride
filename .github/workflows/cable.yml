name: Domstride Action Cable and Turbo Streams
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'runtime/**'
      - 'examples/rails_reference/**'
      - '.github/workflows/cable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [jsdom, jsdom31]
    env:
      RAILS_ENV: test
      DOMSTRIDE_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: npm install --no-audit --no-fund
      - run: node_modules/.bin/esbuild examples/rails_reference/cable.js --bundle --format=iife --outfile=examples/rails_reference/cable.bundle.js
      - name: Real Action Cable server and Turbo source
        run: |
          set -o pipefail
          mkdir -p cable-results
          bundle exec ruby examples/rails_reference/cable_test.rb 2>&1 | tee cable-results/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cable-${{ matrix.engine }}
          path: cable-results/
