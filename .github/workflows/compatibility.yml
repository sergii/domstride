name: Domstride Capybara compatibility
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && github.event.label.name != 'ci:release' && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  contract:
    if: ${{ (github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'ci:full' || github.event.label.name == 'ci:release') && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'ci:release')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [jsdom, jsdom31, happy-dom]
        prefetch: ['0', '1']
    env:
      RAILS_ENV: test
      DOMSTRIDE_ENGINE: ${{ matrix.engine }}
      DOMSTRIDE_QUERY_PREFETCH: ${{ matrix.prefetch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: npm install --no-audit --no-fund
      - run: npm run build:reference
      - name: Capybara contract
        run: |
          mkdir -p compatibility-results
          bundle exec rspec examples/rails_reference/compatibility_spec.rb examples/rails_reference/capybara_spec.rb examples/rails_reference/query_prefetch_spec.rb --format documentation --format json --out compatibility-results/rspec.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.engine }}-${{ matrix.prefetch }}
          path: compatibility-results/
