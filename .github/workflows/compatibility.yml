name: Domstride Capybara compatibility
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'runtime/**'
      - 'examples/rails_reference/**'
      - '.github/workflows/compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [jsdom, jsdom31, happy-dom]
        prefetch: ['0', '1']
    env:
      RAILS_ENV: test
      DOMSTRIDE_ENGINE: ${{ matrix.engine }}
      DOMSTRIDE_QUERY_PREFETCH: ${{ matrix.prefetch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: npm install --no-audit --no-fund
      - run: npm run build:reference
      - name: Capybara contract
        run: |
          mkdir -p compatibility-results
          bundle exec rspec examples/rails_reference/compatibility_spec.rb examples/rails_reference/capybara_spec.rb examples/rails_reference/query_prefetch_spec.rb --format documentation --format json --out compatibility-results/rspec.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.engine }}-${{ matrix.prefetch }}
          path: compatibility-results/
