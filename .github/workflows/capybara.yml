name: Capybara driver and Cuprite benchmark
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  capybara:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: npm install --no-audit --no-fund
      - run: npm run build:reference
      - run: mkdir -p benchmark-results
      - name: Capybara jsdom
        run: |
          bundle exec rspec examples/rails_reference/capybara_spec.rb
          bundle exec ruby examples/rails_reference/capybara_benchmark.rb | tee benchmark-results/capybara-jsdom.json
      - name: Capybara Happy DOM
        if: always()
        continue-on-error: true
        env:
          DOMSTRIDE_ENGINE: happy-dom
        run: |
          bundle exec rspec examples/rails_reference/capybara_spec.rb
          bundle exec ruby examples/rails_reference/capybara_benchmark.rb | tee benchmark-results/capybara-happy-dom.json
      - name: Capybara Cuprite
        if: always()
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$CHROME_PATH" ]]; then
            npx playwright install chromium
            export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          fi
          "$CHROME_PATH" --version
          CAPYBARA_DRIVER=cuprite bundle exec ruby examples/rails_reference/capybara_benchmark.rb | tee benchmark-results/capybara-cuprite.json
      - name: Summary
        if: always()
        run: |
          ruby -rjson -e 'Dir["benchmark-results/*.json"].each { |f| next if File.zero?(f); d=JSON.parse(File.read(f)); puts "#{File.basename(f)}: #{d["median_seconds"]} s" }' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capybara-results
          path: benchmark-results/
