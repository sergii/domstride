name: Domstride CI and benchmark
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: npm install --no-audit --no-fund
      - name: Environment
        run: |
          mkdir -p benchmark-results
          { lscpu; free -h; ruby -v; node -v; bun -v; } | tee benchmark-results/environment.txt
      - name: Node tests and example
        run: |
          bundle exec rake test
          bundle exec ruby examples/counter.rb
          gem build domstride.gemspec
      - name: Node baseline
        run: bundle exec ruby benchmarks/counter.rb | tee benchmark-results/node.json
      - name: Bun compatibility
        id: bun
        continue-on-error: true
        env:
          DOMSTRIDE_RUNTIME: bun
        run: |
          bundle exec rake test
          bundle exec ruby examples/counter.rb
          bundle exec ruby benchmarks/counter.rb | tee benchmark-results/bun.json
      - name: Benchmark summary
        if: always()
        env:
          BUN_OUTCOME: ${{ steps.bun.outcome }}
        run: |
          ruby -rjson -e '
            puts "## Counter benchmark"
            puts "| Runtime | Cold median (s) | Warm median (s) |"
            puts "|---|---:|---:|"
            Dir["benchmark-results/*.json"].sort.each do |file|
              data = JSON.parse(File.read(file))
              puts "| #{data["runtime"]} #{data["runtime_version"]} | #{data["median_cold_seconds"].round(4)} | #{data["median_warm_seconds"].round(4)} |"
            end
            puts "\nBun compatibility: #{ENV["BUN_OUTCOME"]}"
            puts "\nSynthetic benchmark; not a Rails or upstream comparison."
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results/
