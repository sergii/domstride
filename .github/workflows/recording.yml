name: Domstride interaction recording
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && github.event.label.name != 'ci:release' && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  recording:
    if: ${{ (github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'ci:full' || github.event.label.name == 'ci:release') && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'ci:release')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [jsdom, jsdom31, happy-dom]
    env:
      DOMSTRIDE_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: npm install --no-audit --no-fund
      - run: bundle exec ruby -Ilib test/recording_test.rb
      - run: bundle exec ruby -Ilib test/report_test.rb
      - run: bundle exec ruby -Ilib test/reporting_integration_test.rb
      - run: bundle exec ruby -Ilib test/video_attachment_test.rb
      - run: bundle exec ruby -Ilib test/video_cue_test.rb
      - name: Replay viewer browser contract
        if: matrix.engine == 'jsdom31'
        run: |
          npx playwright install chromium
          node --test test/replay_viewer_test.cjs test/browser_video_test.cjs
