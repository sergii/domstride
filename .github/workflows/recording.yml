name: Domstride interaction recording
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'runtime/**'
      - 'test/**'
      - '.github/workflows/recording.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recording:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [jsdom, jsdom31, happy-dom]
    env:
      DOMSTRIDE_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: npm install --no-audit --no-fund
      - run: bundle exec ruby -Ilib test/recording_test.rb
      - name: Replay viewer browser contract
        if: matrix.engine == 'jsdom31'
        run: |
          npx playwright install --with-deps chromium
          node --test test/replay_viewer_test.cjs
