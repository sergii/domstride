name: Domstride Playwright Test reporter
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && github.event.label.name != 'ci:release' && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  reporter:
    if: ${{ (github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'ci:full' || github.event.label.name == 'ci:release') && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'ci:release')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.13'
      - name: Install standalone Playwright Test
        working-directory: examples/playwright_reporter
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - name: Run native tests and preserve failing exit code
        working-directory: examples/playwright_reporter
        env:
          DOMSTRIDE_TEST_REPORT_DIR: ${{ runner.temp }}/domstride-playwright-cases
        run: |
          status=0
          npx playwright test || status=$?
          test "$status" -eq 1
      - name: Import into Studio without Runner dependencies
        run: ruby -Ilib examples/playwright_reporter/verify_report.rb "$RUNNER_TEMP/domstride-playwright-cases"
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-reporter-synthetic-reference
          path: ${{ runner.temp }}/domstride-playwright-cases/report.html
