name: Domstride Capybara query prefetch
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'runtime/**'
      - 'examples/rails_reference/**'
      - '.github/workflows/query-prefetch.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  prefetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILS_ENV: test
      DOMSTRIDE_PROFILE: '1'
      DOMSTRIDE_DSL: capybara
      DOMSTRIDE_BUNDLE_CACHE: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: npm install --no-audit --no-fund
      - run: npm run build:reference
      - run: mkdir -p benchmark-results
      - name: Compatibility in both modes
        run: |
          for engine in jsdom jsdom31 happy-dom; do
            for mode in 0 1; do
              DOMSTRIDE_ENGINE="$engine" DOMSTRIDE_QUERY_PREFETCH="$mode" bundle exec rspec examples/rails_reference/capybara_spec.rb examples/rails_reference/query_prefetch_spec.rb
            done
          done
      - name: Profile paired comparisons
        run: |
          for engine in jsdom jsdom31 happy-dom; do
            for mode in 0 1; do
              DOMSTRIDE_ENGINE="$engine" DOMSTRIDE_QUERY_PREFETCH="$mode" bundle exec ruby examples/rails_reference/profile_benchmark.rb | tee "benchmark-results/$engine-prefetch-$mode.json"
            done
          done
      - name: Summary
        if: always()
        run: |
          ruby -rjson -e '
            puts "| Engine | Prefetch | Median s | IPC calls | Visibility calls | Bytes received |"
            puts "|---|---|---:|---:|---:|---:|"
            Dir["benchmark-results/*.json"].each do |f|
              next if File.zero?(f)
              d = JSON.parse(File.read(f)); p = d.fetch("profile"); c = p.fetch("commands")
              puts "| #{d["engine"]} | #{d["query_prefetch"]} | #{d["median_seconds"].round(4)} | #{c.values.sum { |r| r["count"] }} | #{c.dig("node_action.visible", "count") || 0} | #{p["bytes_received"]} |"
            end
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-prefetch-results
          path: benchmark-results/
