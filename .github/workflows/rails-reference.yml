name: Rails reference and browser parity
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && github.event.label.name != 'ci:release' && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  reference:
    if: ${{ (github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'ci:full' || github.event.label.name == 'ci:release') && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'ci:release')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: npm install --no-audit --no-fund
      - run: npm run build:reference
      - name: Environment
        run: |
          mkdir -p benchmark-results
          { ruby -v; bundle exec ruby -rrails -e 'puts Rails.version'; node -v; lscpu; free -h; } > benchmark-results/rails-environment.txt
          cp package-lock.json Gemfile.lock benchmark-results/
      - name: Core tests
        run: bundle exec rake test
      - name: Rails jsdom reference
        id: jsdom
        run: |
          bundle exec ruby examples/rails_reference/test.rb
          bundle exec rspec examples/rails_reference/reference_spec.rb
          bundle exec ruby examples/rails_reference/benchmark.rb | tee benchmark-results/rails-jsdom.json
      - name: Rails Happy DOM reference
        if: always()
        continue-on-error: true
        env:
          DOMSTRIDE_ENGINE: happy-dom
        run: |
          bundle exec ruby examples/rails_reference/test.rb
          bundle exec rspec examples/rails_reference/reference_spec.rb
          bundle exec ruby examples/rails_reference/benchmark.rb | tee benchmark-results/rails-happy-dom.json
      - name: Chromium reference
        if: always()
        run: |
          npx playwright install chromium
          bundle exec ruby examples/rails_reference/server.rb > benchmark-results/rails-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4567/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4567/ > /dev/null
          node examples/rails_reference/browser.cjs | tee benchmark-results/rails-chromium.json
      - name: Summary
        if: always()
        run: |
          echo '## Rails reference: 10 scenarios per sample, warm session, 5 repeats' >> "$GITHUB_STEP_SUMMARY"
          ruby -rjson -e 'Dir["benchmark-results/rails-*.json"].each { |f| d=JSON.parse(File.read(f)); puts "#{File.basename(f)}: #{d["median_seconds"]} s" }' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rails-reference-results
          path: benchmark-results/
  petstore-living-documentation:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      RAILS_ENV: test
      PETSTORE_BASE_URL: http://127.0.0.1:3000
      PETSTORE_COMMIT: 78b67b411c41011e8cabc2130190c8e3dfeb9a61
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sergii/petstore
          ref: 78b67b411c41011e8cabc2130190c8e3dfeb9a61
          path: petstore-app
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          working-directory: petstore-app
      - run: bundle install
        working-directory: petstore-app
      - run: bin/rails db:prepare
        working-directory: petstore-app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: examples/petstore
      - run: npx playwright install chromium
        working-directory: examples/petstore
      - run: npm run typecheck
        working-directory: examples/petstore
      - name: Independent Playwright recorder browser smoke
        run: node test-playwright-recorder.cjs
        working-directory: examples/petstore
      - run: node test-focus-geometry.cjs
        working-directory: examples/petstore
      - run: node test-documentation-model.cjs
        working-directory: examples/petstore
      - name: Execute Petstore acceptance tests and generate documentation
        env:
          PETSTORE_FEATURE: ${{ github.workspace }}/petstore-app/features/marketplace/listings/publish_listing.feature
          GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          (
            cd petstore-app
            bin/rails runner 'User.find_or_create_by!(email_address: "seller@example.test") { |u| u.name = "Alex Demo"; u.password = "synthetic-demo-password" }'
          )
          (cd petstore-app && exec bin/rails server -b 127.0.0.1 -p 3000) > "$RUNNER_TEMP/petstore.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/up; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/up || { cat "$RUNNER_TEMP/petstore.log"; exit 1; }
          (cd examples/petstore && npm test)
          (cd petstore-app && bin/rails runner 'User.find_by!(email_address: "seller@example.test").listings.destroy_all')
          (cd examples/petstore && npm run execution)
          (cd petstore-app && bin/rails runner 'User.find_by!(email_address: "seller@example.test").listings.destroy_all')
          (cd examples/petstore && npm run docs && npm run docs:pair && node verify.cjs)
          guided=$(find examples/petstore/artifacts -name video-pair.json -printf '%h\n' -quit)
          test -n "$guided"
          ruby -Ilib exe/domstride docs export --synthetic-reference "$guided"
      - name: Inspect recorded focus intervals
        working-directory: examples/petstore
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
          python3 inspect-focus-media.py artifacts
          node test-focus-vtt.cjs
          node render-focus-replay.cjs artifacts
          node smoke-focus-replay.cjs artifacts
          guided=$(find artifacts -name video-pair.json -printf '%h\n' -quit)
          test -n "$guided"
          ruby -I ../../lib -r domstride/report -e 'Domstride::Report.export(ARGV[0], output: File.join(ARGV[0], "core-replay.html"))' "$guided"
          ruby test-observed-protocol.rb "$guided"
          node smoke-core-replay.cjs artifacts
      - name: Build static Starlight Help Center
        working-directory: examples/petstore/help-center
        run: |
          export_dir=$(find ../artifacts -type d -name static-export -print -quit)
          test -n "$export_dir"
          npm install --no-audit --no-fund
          npm run import -- "$export_dir"
          npm run build
          npm run preview > "$RUNNER_TEMP/help-center.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4321/ > /dev/null
          npm run smoke
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: petstore-help-center
          path: |
            examples/petstore/help-center/dist/
            examples/petstore/help-center/help-center-desktop.png
            examples/petstore/help-center/help-center-mobile.png
          retention-days: 7
      - name: Build static Fumadocs Help Center
        working-directory: examples/petstore/fumadocs
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          export_dir=$(find ../artifacts -type d -name static-export -print -quit)
          test -n "$export_dir"
          npm install --no-audit --no-fund
          npm run import -- "$export_dir"
          npm run build
          python3 -m http.server 4322 --bind 127.0.0.1 --directory out > "$RUNNER_TEMP/fumadocs.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4322/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4322/ > /dev/null
          npm run smoke
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: petstore-fumadocs
          path: |
            examples/petstore/fumadocs/out/
            examples/petstore/fumadocs/help-center-desktop.png
            examples/petstore/fumadocs/help-center-mobile.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fumadocs-diagnostics
          path: |
            examples/petstore/fumadocs/out/
            examples/petstore/fumadocs/help-center-failure.png
            examples/petstore/fumadocs/failure.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Rails server log
        if: failure()
        run: cat "$RUNNER_TEMP/petstore.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: petstore-living-documentation
          path: examples/petstore/artifacts/
          retention-days: 7
