name: Specdrive isolated UI coverage Viewer research
on:
  pull_request:
    paths:
      - 'viewer/**'
      - 'examples/herb_lab/coverage.rb'
      - 'test/support/isolated_coverage_smoke.rb'
      - '.github/workflows/herb-viewer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      matrix:
        ruby: ['3.3.14', '4.0.10']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Test shared aggregator and isolated CLI
        run: |
          ruby examples/herb_lab/coverage_test.rb
          ruby viewer/build.rb "$RUNNER_TEMP/coverage-viewer"
          cp test/support/isolated_coverage_smoke.rb "$RUNNER_TEMP/coverage-smoke.rb"
          (cd "$RUNNER_TEMP"; env -u RUBYOPT -u RUBYLIB -u BUNDLE_GEMFILE ruby coverage-smoke.rb "$RUNNER_TEMP/coverage-viewer/bin/viewer")
          test ! -e "$RUNNER_TEMP/coverage-viewer/runtime"
          test ! -e "$RUNNER_TEMP/coverage-viewer/examples"
