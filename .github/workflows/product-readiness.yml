name: Domstride product readiness
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'runtime/**'
      - 'exe/**'
      - 'test/**'
      - 'examples/rails_reference/**'
      - 'specdrive.gemspec'
      - '.github/workflows/product-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: npm install --no-audit --no-fund
      - run: npm run build:reference
      - name: Independent Cucumber Messages normalization
        run: node test/cucumber_messages_normalizer_test.cjs
      - name: Independent Playwright recorder lifecycle
        run: node test/playwright_recorder_test.cjs
      - name: Documentation protocol validation
        run: node test/documentation_protocol_test.cjs
      - name: Independent framework adapter
        run: node test/framework_integration_test.cjs
      - name: Specdrive compatibility entrypoints
        run: bundle exec ruby -Ilib test/specdrive_compatibility_test.rb
      - name: Configuration
        run: bundle exec ruby -Ilib test/configuration_test.rb
      - name: Named native profiles
        run: |
          for profile in compatible fast deterministic; do
            DOMSTRIDE_PERFORMANCE_PROFILE="$profile" bundle exec ruby examples/rails_reference/test.rb
          done
      - name: Rails system tests
        run: |
          for profile in compatible fast; do
            DOMSTRIDE_PERFORMANCE_PROFILE="$profile" bundle exec ruby examples/rails_reference/system_test.rb
          done
      - name: Capybara compatibility regression
        run: |
          for profile in compatible fast; do
            DOMSTRIDE_PERFORMANCE_PROFILE="$profile" bundle exec rspec examples/rails_reference/capybara_spec.rb examples/rails_reference/query_prefetch_spec.rb
          done
      - name: Developer experience and generated system tests
        run: |
          bundle exec ruby -Ilib test/developer_experience_test.rb
          DOMSTRIDE_DRIVER=domstride bundle exec ruby examples/rails_reference/generated_system_test.rb
          npx playwright install chromium
          CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")" DOMSTRIDE_DRIVER=browser DOMSTRIDE_BROWSER_DRIVER=domstride_reference_browser bundle exec ruby examples/rails_reference/generated_system_test.rb
      - name: Installed gem smoke test outside checkout
        run: |
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          gem build specdrive.gemspec --output "$temp/specdrive.gem"
          export GEM_HOME="$temp/gems"
          export GEM_PATH="$temp/gems"
          gem install "$temp/specdrive.gem" --no-document
          gem list --local
          export DOMSTRIDE_RUNTIME_HOME="$temp/runtime"
          cd "$temp"
          ruby -rdomstride -e 'abort "Not the installed gem" unless Gem.loaded_specs.fetch("specdrive").full_gem_path.start_with?(ENV.fetch("GEM_HOME"))'
          if "$temp/gems/bin/domstride" doctor; then echo "Unexpected runtime before setup"; exit 1; fi
          "$temp/gems/bin/domstride" setup
          "$temp/gems/bin/domstride" doctor
          SPECDRIVE_RUNTIME_HOME="$temp/runtime" "$temp/gems/bin/specdrive" doctor
          ruby -rspecdrive -e 'abort unless Specdrive.equal?(Domstride) && Specdrive::Session.name == "Specdrive::Session"'
          ruby -rspecdrive/capybara -e 'abort unless Capybara.drivers.key?(:specdrive) && Capybara.drivers.key?(:domstride)'
          "$temp/gems/bin/domstride" doctor --json | ruby -rjson -e 'abort unless JSON.parse(STDIN.read).fetch("status") == "ok"'
          "$temp/gems/bin/domstride" setup
          node "$GITHUB_WORKSPACE/test/documentation_package_test.cjs" "$temp/gems/bin/specdrive"
          gem_root="$(ruby -rdomstride -e 'print Gem.loaded_specs.fetch("specdrive").full_gem_path')"
          node "$GITHUB_WORKSPACE/test/framework_integration_test.cjs" "$gem_root/lib/domstride/documentation" "$gem_root/adapters"
          for profile in compatible fast deterministic; do
            DOMSTRIDE_PERFORMANCE_PROFILE="$profile" ruby -rdomstride -e 'Domstride::Session.open { |p| p.mount_html(%q{<p id="status">Ready</p>}); p.assert_text("#status", "Ready") }; puts "Installed profile OK"'
          done
          ruby -rdomstride/capybara -e 'abort unless Capybara.drivers.key?(:domstride); app = ->(_) { [200, {"content-type" => "text/html"}, ["<p id=ready>Ready</p>"]] }; page = Capybara::Session.new(:domstride, app); begin; page.visit("/"); abort unless page.has_css?("#ready", text: "Ready"); ensure; page.driver.quit; end'
          mkdir -p "$GITHUB_WORKSPACE/package-results"
          cp "$temp/specdrive.gem" "$GITHUB_WORKSPACE/package-results/"
      - uses: actions/upload-artifact@v4
        with:
          name: specdrive-gem-preview
          path: package-results/
