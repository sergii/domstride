name: Domstride vs rails-jsdom
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && github.event.label.name != 'ci:release' && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    if: ${{ (github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'ci:full' || github.event.label.name == 'ci:release') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:release')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: npm install --no-audit --no-fund
      - run: npm run build:reference
      - run: mkdir -p benchmark-results
      - name: Domstride baseline
        run: |
          bundle exec ruby examples/rails_reference/capybara_benchmark.rb | tee benchmark-results/domstride-jsdom.json
          DOMSTRIDE_ENGINE=happy-dom bundle exec ruby examples/rails_reference/capybara_benchmark.rb | tee benchmark-results/domstride-happy-dom.json
      - name: Upstream dependencies
        env:
          BUNDLE_GEMFILE: examples/rails_reference/upstream_gemfile.rb
        run: |
          bundle install
          npm --prefix examples/rails_reference/upstream_app install --no-audit --no-fund
      - name: Upstream reference
        env:
          BUNDLE_GEMFILE: examples/rails_reference/upstream_gemfile.rb
          RESULT_PATH: benchmark-results/rails-jsdom.json
        run: bundle exec ruby examples/rails_reference/upstream_benchmark.rb
      - name: Summary
        if: always()
        run: |
          ruby -rjson -e 'Dir["benchmark-results/*.json"].each { |f| next if File.zero?(f); d=JSON.parse(File.read(f)); puts "#{File.basename(f)}: #{d["median_seconds"]} s" }' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-comparison
          path: benchmark-results/
